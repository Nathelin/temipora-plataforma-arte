name: pruebas

on:
  push:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: temipora
          POSTGRES_USER: temipora
          POSTGRES_PASSWORD: temipora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U temipora -d temipora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      BD_USUARIO: temipora
      BD_CONTRASENIA: temipora
      JWT_KEY: ci-test-secret-key-with-at-least-32-characters
      JWT_TIME: 3600000
      AWS_ACCESS: test
      AWS_KEY: test
      AWS_BUCKET: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-springboot/pom.xml

      - name: Run backend tests
        working-directory: backend-springboot
        run: mvn --batch-mode verify
