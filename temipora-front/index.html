<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icon.ico">
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('temipora-tema')
          var sistema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'noche' : 'claro'
          var tema = guardado === 'noche' || guardado === 'claro' ? guardado : sistema
          document.documentElement.dataset.theme = tema
          document.documentElement.style.colorScheme = tema === 'noche' ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'claro'
        }
      })()
    </script>
    <link href="/src/style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff6f1">
    <title>Temipora</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
