spring.application.name=backend-springboot
spring.profiles.default=local
spring.datasource.url=jdbc:postgresql://localhost:5432/temipora
spring.datasource.username=${BD_USUARIO}
spring.datasource.password=${BD_CONTRASENIA}

spring.jpa.database=POSTGRESQL
spring.jpa.generate-ddl=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Permite aplicar migraciones base (ej. V0_1) agregadas después de migraciones ya aplicadas.
spring.flyway.out-of-order=true

server.port=8080

# Respuestas JSON/CSS/JS comprimidas. Las imágenes ya vienen comprimidas y no
# se incluyen para no procesarlas dos veces.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/javascript,text/css,text/html,text/plain,image/svg+xml

spring.main.banner-mode=console
spring.banner.location=classpath:/banner.txt

jwt.secret=${JWT_KEY}
jwt.time.expiration = ${JWT_TIME}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# Los archivos de las entregas se guardan fuera de la raíz pública.
storage.private.dir=storage-privado

spring.web.error.whitelabel.enabled=false


cloud.aws.credentials.access-key=${AWS_ACCESS}
cloud.aws.credentials.secret-key=${AWS_KEY}
cloud.aws.region.static = us-east-2

aws.bucket.name=${AWS_BUCKET}

cotizacion.api.url=https://dolarapi.com/v1/dolares/oficial

pagos.proveedor=simulado

# MercadoPago. Las credenciales se leen de variables de entorno.
pagos.mercadopago.access-token=${MP_ACCESS_TK:}
pagos.mercadopago.client-id=${TEMIPORA_MP_CLIENT_ID:}
pagos.mercadopago.client-secret=${TEMIPORA_MP_CLIENT_SECRET:}
pagos.mercadopago.oauth-url=${MP_OAUTH_URL:https://auth.mercadopago.com.ar/authorization}
# Estimación del arancel de MercadoPago para mostrar el neto antes de pagar.
# El valor real lo informa MP por pago (fee_details).
pagos.mercadopago.arancel-estimado=${MP_ARANCEL_ESTIMADO:3.49}
pagos.mercadopago.arancel-iva=${MP_ARANCEL_IVA:21}
pagos.mercadopago.public-key=${MP_PUBLIC_KEY:}
pagos.mercadopago.webhook-secret=${TEMIPORA_WEBHOOK:${MP_WEBHOOK_SECRET:}}
pagos.mercadopago.notification-url=${MP_NOTIFICATION_URL:}
pagos.mercadopago.sandbox=${MP_SANDBOX:false}
# Pide un access token de prueba en el canje OAuth (test_token). Por defecto
# sigue al entorno; se puede forzar a false para emitir un token normal.
pagos.mercadopago.oauth-test-token=${MP_OAUTH_TEST_TOKEN:${pagos.mercadopago.sandbox:false}}
# Aprobado/rechazado sin estados intermedios. Se desactiva en produccion
# porque no admite challenges (3DS / verificacion de identidad).
pagos.mercadopago.binary-mode=${MP_BINARY_MODE:false}
# Enviar marketplace_fee tambien en sandbox. MercadoPago exige verificacion de
# identidad del pagador para los pagos con comision y los usuarios de prueba no
# pueden completarla, por eso por defecto se omite en sandbox.
pagos.mercadopago.comision-en-sandbox=${MP_COMISION_SANDBOX:false}

# Tiempo que se reservan el stock y el link de pago de una compra.
compra.reserva-minutos=10

# URL del frontend para los retornos del checkout.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Clave AES-256 (Base64) para cifrar los tokens de MercadoPago.
pagos.token.key=${PAGOS_TOKEN_KEY:}

# Email. En desarrollo apunta a Mailpit (localhost:1025, UI en localhost:8025).
spring.mail.host=${TEMIPORA_MAIL_HOST:localhost}
spring.mail.port=${TEMIPORA_MAIL_PORT:1025}
spring.mail.username=${TEMIPORA_MAIL_USERNAME:}
spring.mail.password=${TEMIPORA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${TEMIPORA_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${TEMIPORA_MAIL_STARTTLS:false}

temipora.mail.habilitado=${TEMIPORA_MAIL_HABILITADO:true}
temipora.mail.remitente=${TEMIPORA_MAIL_FROM:no-responder@temipora.local}
temipora.mail.remitente-nombre=${TEMIPORA_MAIL_FROM_NAME:Temipora}

# Mail de contacto público de la plataforma (se muestra al usuario sancionado).
temipora.contacto.email=${TEMIPORA_CONTACTO_EMAIL:temiporasupport@gmail.com}
temipora.mail.base-url=${app.frontend.cloud.url:${app.frontend.url:http://localhost:5173}}
temipora.mail.api-url=${app.frontend.cloud.url:${app.frontend.url:http://localhost:5173}}

# Corrida diaria de promociones según la hora configurada en el panel.
temipora.reactivacion.programada=${TEMIPORA_REACTIVACION_PROGRAMADA:true}

# Anclaje del registro de autenticidad en la blockchain de Bitcoin (OpenTimestamps).
temipora.anclaje.habilitado=${TEMIPORA_ANCLAJE_HABILITADO:true}
temipora.anclaje.calendario-url=${TEMIPORA_ANCLAJE_CALENDARIO:https://alice.btc.calendar.opentimestamps.org,https://bob.btc.calendar.opentimestamps.org,https://finney.calendar.eternitywall.com}
temipora.anclaje.tamano-lote=${TEMIPORA_ANCLAJE_LOTE:500}

# Credenciales de prueba y configuracion local: application-local.properties (ignorado por git).

